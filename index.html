<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NMT Trading LLC — 3D Commercial</title>
  <meta name="description" content="Real-time 3D animated commercial visual for NMT Trading LLC — cosmetics & beauty wholesale distribution." />
  <style>
    @font-face { font-family: 'Cormorant Garamond'; font-weight: 300 700; src: url(assets/fonts/CormorantGaramond-latin.woff2) format('woff2'); }
    @font-face { font-family: 'Montserrat'; font-weight: 100 900; src: url(assets/fonts/Montserrat-latin.woff2) format('woff2'); }
    :root { --bg: #0e0b0a; --ink: #f3e6d2; --gold: #d8b37a; --line: rgba(216, 179, 122, .35); }
    html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; color: var(--ink); font-family: Montserrat, system-ui, sans-serif; }
    canvas#scene { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }

    /* Copy-safe guide: shows the right-side negative space reserved for text. */
    .guide { position: fixed; top: 9vh; bottom: 9vh; right: 5vw; width: 38vw; border: 1px dashed var(--line); border-radius: 6px;
      display: none; flex-direction: column; justify-content: center; gap: 1.4vh; padding: 0 3vw; box-sizing: border-box; pointer-events: none; }
    .show-guide .guide { display: flex; }
    .guide small { letter-spacing: .35em; font-size: clamp(9px, .75vw, 13px); color: var(--gold); text-transform: uppercase; }
    .guide h1 { margin: 0; font: 600 clamp(28px, 4.2vw, 76px)/1.02 'Cormorant Garamond', serif; letter-spacing: .01em; }
    .guide p { margin: 0; font-size: clamp(11px, 1vw, 17px); line-height: 1.6; opacity: .75; max-width: 30em; }
    .guide .rule { width: 64px; height: 1px; background: var(--gold); }

    .ui { position: fixed; left: 16px; bottom: 16px; display: flex; gap: 8px; flex-wrap: wrap; opacity: 0; transition: opacity .4s; }
    .ready .ui { opacity: .85; }
    .hide-ui .ui { display: none; }
    .ui button { font: 500 11px/1 Montserrat, sans-serif; letter-spacing: .14em; text-transform: uppercase; color: var(--ink);
      background: rgba(20, 16, 14, .6); border: 1px solid var(--line); border-radius: 999px; padding: 9px 14px; cursor: pointer; backdrop-filter: blur(6px); }
    .ui button:hover { border-color: var(--gold); }
    .ui .hint { align-self: center; font-size: 10px; letter-spacing: .12em; opacity: .5; }
  </style>
  <script type="importmap">
    { "imports": { "three": "./vendor/three/build/three.module.js", "three/addons/": "./vendor/three/examples/jsm/" } }
  </script>
</head>
<body>
  <canvas id="scene"></canvas>

  <div class="guide" aria-hidden="true">
    <small>Copy-safe area · sample layout</small>
    <h1>Your headline<br />goes here</h1>
    <div class="rule"></div>
    <p>Right-side negative space reserved for promotional messaging, website, phone number and contact details.</p>
  </div>

  <div class="ui">
    <button id="btn-pause">Pause</button>
    <button id="btn-guide">Text-safe guide</button>
    <button id="btn-shot">4K still</button>
    <button id="btn-rec">Record loop</button>
    <span class="hint">H hide UI · G guide · Space pause</span>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
